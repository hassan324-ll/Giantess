<div class="management-page change-password-page">
  <header class="page-header">
    <div>
      <h1>Change Password</h1>
      <p>Update the password for the current admin account.</p>
    </div>
  </header>

  <section class="password-panel">
    <form class="password-form" (ngSubmit)="submit()">
      <label class="form-field">
        <span>Current password</span>
        <span class="password-input">
          <input
            [type]="showCurrentPassword() ? 'text' : 'password'"
            name="currentPassword"
            [(ngModel)]="form.currentPassword"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showCurrentPassword() ? 'Hide current password' : 'Show current password'"
            (click)="toggleCurrentPassword()"
          >
            <fa-icon [icon]="showCurrentPassword() ? faEyeSlash : faEye"></fa-icon>
          </button>
        </span>
      </label>

      <label class="form-field">
        <span>New password</span>
        <span class="password-input">
          <input
            [type]="showNewPassword() ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="form.newPassword"
            autocomplete="new-password"
            minlength="8"
            required
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showNewPassword() ? 'Hide new password' : 'Show new password'"
            (click)="toggleNewPassword()"
          >
            <fa-icon [icon]="showNewPassword() ? faEyeSlash : faEye"></fa-icon>
          </button>
        </span>
      </label>

      <label class="form-field">
        <span>Confirm new password</span>
        <span class="password-input">
          <input
            [type]="showConfirmPassword() ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="form.confirmPassword"
            autocomplete="new-password"
            minlength="8"
            required
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showConfirmPassword() ? 'Hide confirm password' : 'Show confirm password'"
            (click)="toggleConfirmPassword()"
          >
            <fa-icon [icon]="showConfirmPassword() ? faEyeSlash : faEye"></fa-icon>
          </button>
        </span>
      </label>

      <p class="success-message" *ngIf="successMessage()">{{ successMessage() }}</p>
      <p class="error-message" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <button class="primary-button" type="submit" [disabled]="isSaving()">
        {{ isSaving() ? 'Updating...' : 'Update Password' }}
      </button>
    </form>
  </section>
</div>
