<section class="relative isolate overflow-hidden">
  <div
    class="relative min-h-[220px] bg-slate-900 bg-cover bg-center bg-no-repeat sm:min-h-[280px] lg:min-h-[330px]"
    [style.background-image]="'url(' + imagePath + ')'"
  >
    <div class="absolute inset-0 bg-[linear-gradient(90deg,rgba(5,34,40,0.82)_0%,rgba(14,75,88,0.68)_45%,rgba(30,99,218,0.42)_100%)]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_left,rgba(31,180,217,0.16),transparent_35%)]"></div>

    <div
      class="relative mx-auto flex min-h-[220px] w-[min(1240px,calc(100%-32px))] flex-col items-center justify-center px-4 py-10 text-center text-white sm:min-h-[280px] sm:px-8 lg:min-h-[330px]"
    >
      <h1 class="text-4xl font-black tracking-[-0.03em] drop-shadow-[0_8px_20px_rgba(0,0,0,0.35)] sm:text-5xl lg:text-6xl">
        {{ title }}
      </h1>
      <p class="mt-4 text-sm font-semibold tracking-[0.18em] text-white/80 sm:text-base">
        Giantess
        <span class="mx-2 text-[#7ee6f8]">></span>
        {{ breadcrumb || title }}
      </p>
    </div>
  </div>
</section>
